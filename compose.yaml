name: voice-bot

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in the Komodo stack environment}
      SILERO_TTS_URL: http://silero:8000
    depends_on:
      - silero
    volumes:
      - voice_bot_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

  silero:
    image: twirapp/silero-tts-api-server:latest
    restart: unless-stopped
    environment:
      TEXT_LENGTH_LIMIT: 930
      MKL_NUM_THREADS: ${SILERO_CPU_THREADS:-2}
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  voice_bot_data:
    name: voice_bot_data
